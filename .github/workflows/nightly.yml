name: nightly

# The tip of main, built and published as a pre-release so anyone who wants to
# try what is coming can, without it ever being mistaken for a release.
#
# On push rather than on a timer: a nightly that rebuilds an unchanged tree just
# to move a date is noise, and a change worth trying is worth having within the
# hour. The manual trigger is for rebuilding after a secret or a runner changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only ever one nightly in flight; a newer push makes an older build pointless.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write        # only to move the nightly pre-release

jobs:
  nightly:
    name: build and publish
    runs-on: ubuntu-latest
    # A fork has none of the signing secrets, and an unsigned nightly cannot
    # upgrade the one already on someone's phone.
    if: github.repository == 'nils-fl/kettenblatt'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Same bar as a release: unstable means "not yet a release", not "not yet
      # working". A nightly that fails its own tests should never be offered.
      - name: Test
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See the Releases section of the README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      # yyMMddHH: monotonic without a stored counter, so a rebuild an hour later
      # always supersedes. UTC, because the runner's clock is the only one here.
      - name: Stamp the build
        id: stamp
        run: |
          echo "value=$(date -u +%y%m%d%H)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      # NIGHTLY_STAMP switches app/build.gradle.kts to the nightly applicationId,
      # version and launcher label; see the comment there for why it installs
      # beside a release rather than over it.
      - name: Build
        env:
          NIGHTLY_STAMP: ${{ steps.stamp.outputs.value }}
          NIGHTLY_SHA: ${{ steps.stamp.outputs.sha }}
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name the artefact after the build
        run: |
          # Gradle writes app-release-unsigned.apk when it has no key, so the
          # signed name existing is itself the check that signing happened.
          test -f app/build/outputs/apk/release/app-release.apk \
            || { echo "::error::built APK is unsigned; check the signing secrets"; exit 1; }
          mv app/build/outputs/apk/release/app-release.apk \
            "kettenblatt-nightly-${{ steps.stamp.outputs.value }}-${{ steps.stamp.outputs.sha }}.apk"

      # One rolling pre-release rather than one per build: a list of nightlies
      # is a list of things nobody should install, and the only one worth having
      # is the newest. Deleting first because the tag has to move with it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true

          cat > notes.md <<'EOF'
          **This is not a release.** It is whatever was on `main` at the time,
          built automatically. It has passed the unit tests and nothing else —
          no ride has been taken with it.

          It installs **beside** a stable Kettenblatt rather than replacing it:
          a different application id, and *Kettenblatt Nightly* on the launcher.
          Nothing about trying it can disturb the version you rely on, though the
          two keep separate route libraries and ride histories, so routes do not
          carry across. Export a backup from one and restore it into the other if
          you want them.

          If something here is wrong, that is what it is for — please open an
          issue and say which build.
          EOF

          gh release create nightly \
            "kettenblatt-nightly-${{ steps.stamp.outputs.value }}-${{ steps.stamp.outputs.sha }}.apk" \
            --title "Nightly — ${{ steps.stamp.outputs.date }} (${{ steps.stamp.outputs.sha }})" \
            --notes-file notes.md \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"
